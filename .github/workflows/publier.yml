# Publication d'une version : à chaque étiquette « v1.2.3 » envoyée sur GitHub (le CHANGELOG.md doit avoir sa section), l'installateur MSI
# est compilé, signé pour Windows par SignPath (dès que la variable SIGNPATH_ORGANIZATION_ID est
# définie), signé pour la mise à jour automatique, puis publié dans les Releases avec latest.json,
# le fichier que les Établi installés consultent. Marche à suivre : docs/14-publier-une-version.md.
name: Publication

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    name: Installateur Windows
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      SIGNPATH: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Étiquette et version de l'application identiques
        run: |
          tag="${GITHUB_REF_NAME#v}"
          app=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          if [ "$tag" != "$app" ]; then
            echo "::error::Étiquette v$tag mais tauri.conf.json en $app : lancez « npm run version:app -- $tag » avant de publier."
            exit 1
          fi

      # Les notes viennent du CHANGELOG.md : sans section pour cette version, la publication s'arrête tout de suite.
      - name: Notes de version (CHANGELOG.md)
        run: |
          version="${GITHUB_REF_NAME#v}"
          node scripts/notes-version.mjs CHANGELOG.md "$version" --texte > "$RUNNER_TEMP/notes.txt"
          node scripts/notes-version.mjs CHANGELOG.md "$version" --release > "$RUNNER_TEMP/notes-release.md"
          cat "$RUNNER_TEMP/notes-release.md"

      - name: Dépendances npm
        run: npm ci

      - name: Tests des calculs
        run: npm test

      - name: Plugins (compilés et copiés pour l'installateur)
        run: npm run build:plugins

      - name: Installateur MSI
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -w @etabli/desktop

      - name: Emplacement du MSI
        id: msi
        run: |
          path=$(ls apps/desktop/src-tauri/target/release/bundle/msi/*.msi)
          echo "path=$path" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$path")" >> "$GITHUB_OUTPUT"

      # ——— Signature Windows (Authenticode) par SignPath : une demande, approuvée à la main ———
      - name: MSI non signé, envoyé à SignPath
        id: non-signe
        if: env.SIGNPATH == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: installateur-non-signe
          path: ${{ steps.msi.outputs.path }}
          if-no-files-found: error

      - name: Signature Windows (SignPath, attend l'approbation)
        if: env.SIGNPATH == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          github-artifact-id: ${{ steps.non-signe.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signe

      - name: MSI signé à la place du MSI non signé
        if: env.SIGNPATH == 'true'
        run: cp "signe/${{ steps.msi.outputs.name }}" "${{ steps.msi.outputs.path }}"

      # ——— Signature de mise à jour, sur le MSI final, puis publication ———
      - name: Signature de mise à jour (.sig)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        working-directory: apps/desktop
        run: npx tauri signer sign "$GITHUB_WORKSPACE/${{ steps.msi.outputs.path }}"

      - name: latest.json
        run: node scripts/latest-json.mjs "$GITHUB_REF_NAME" "${{ steps.msi.outputs.path }}" "$RUNNER_TEMP/notes.txt" > "$RUNNER_TEMP/latest.json"

      - name: Publication de la version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "${{ steps.msi.outputs.path }}" \
            "${{ steps.msi.outputs.path }}.sig" \
            "$RUNNER_TEMP/latest.json" \
            --title "Établi $GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/notes-release.md"
