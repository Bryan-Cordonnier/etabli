# Renouvellement du catalogue signé (docs/20) : le catalogue a une date de fin (30 jours). Chaque mois, et à la demande, il est
# resigné avec une nouvelle séquence et une nouvelle date de fin, sans toucher aux plugins. Un premier lancement manuel fait
# passer le catalogue actuel (non signé) au format signé.
name: Catalogue (renouvellement)

on:
  schedule:
    - cron: "47 5 1 * *"
  workflow_dispatch:

permissions:
  contents: write

# Même groupe que la publication d'un plugin et les notes de version : le catalogue n'est jamais réécrit deux fois à la fois.
concurrency:
  group: catalogue
  cancel-in-progress: false

jobs:
  renouveler:
    name: Resigner le catalogue
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Dépendances npm
        run: npm ci

      - name: Catalogue actuel
        run: |
          mkdir -p paquets
          gh release download catalogue --pattern catalogue.json --dir paquets

      - name: Nouvelle signature, nouvelle séquence, nouvelle date de fin
        run: node scripts/catalogue-signe.mjs paquets/catalogue.json

      - name: Publication
        run: |
          gh release upload catalogue paquets/catalogue.json paquets/catalogue.json.minisig --clobber
          echo "Catalogue resigné."
