# Application Android (Capacitor) : fabrique un APK de test à installer à la main sur le téléphone.
# Lancement manuel (onglet Actions › « Android (APK de test) ») ou à chaque Pull Request qui touche au mobile.
name: Android (APK de test)

on:
  workflow_dispatch:
    inputs:
      sonde_pont:
        description: "APK de sonde du pont natif (outil de test, remplace l'application ; voir tools/sonde-pont-android)"
        type: boolean
        default: false
  pull_request:
    paths:
      - apps/mobile/**
      - apps/desktop/src/lib/mobile/**
      - tools/sonde-pont-android/**
      - .github/workflows/android.yml

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: APK de test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Dépendances npm
        run: npm ci

      - name: Version web (plugins compris)
        run: npm run build:web

      - name: APK de test
        working-directory: apps/mobile
        run: npm run apk
        env:
          ETABLI_SONDE_PONT: ${{ inputs.sonde_pont && '1' || '0' }}

      # Règles d'adresse et de chemin des plugins (origine par plugin), en Java pur : CheminsPluginsTest.
      - name: Tests Java
        working-directory: apps/mobile/android
        run: ./gradlew testDebugUnitTest

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.sonde_pont && 'etabli-sonde-pont.apk' || 'etabli-test.apk' }}
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
