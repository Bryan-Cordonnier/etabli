# APK Android (Tauri mobile) : construit le moteur pour Android, avec le correctif du pont natif (docs/26).
# L'APK de test embarque les plugins d'exemple du dépôt ; le moteur seul, lui, ne livre aucun plugin.
name: Android

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/desktop/**"
      - "crates/**"
      - "packages/**"
      - ".github/workflows/android.yml"

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: APK de test
    runs-on: ubuntu-latest
    env:
      ETABLE_PLUGINS_DIR: ${{ github.workspace }}/plugins
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Cible Rust pour Android
        run: rustup target add aarch64-linux-android

      - name: NDK Android (préinstallé sur l'image)
        run: |
          echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Dépendances npm
        run: npm ci

      - name: Plugins d'exemple
        run: npm run build:plugins

      - name: Projet Android et correctifs (pont natif fermé, alarmes exactes)
        run: npm run android:init -w @etabli/desktop

      - name: APK de test
        run: npm run android:build -w @etabli/desktop -- --debug --target aarch64

      - uses: actions/upload-artifact@v7
        with:
          name: etable-android-apk-de-test
          path: apps/desktop/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error