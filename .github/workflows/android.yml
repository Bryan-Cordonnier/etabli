# Application Android (Capacitor) : fabrique un APK de test à installer à la main sur le téléphone.
# Lancement manuel (onglet Actions › « Android (APK de test) ») ou à chaque Pull Request qui touche au mobile.
name: Android (APK de test)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - apps/mobile/**
      - apps/desktop/src/lib/mobile/**
      - .github/workflows/android.yml

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: APK de test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Dépendances npm
        run: npm ci

      - name: Version web (plugins compris)
        run: npm run build:web

      - name: APK de test
        working-directory: apps/mobile
        run: npm run apk

      - uses: actions/upload-artifact@v7
        with:
          name: etabli-test.apk
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
