# Notes de version : à chaque changement du journal des changements sur main (ou à la demande), le texte de chaque
# Release GitHub d'Établi est remis d'après CHANGELOG.md (une faute corrigée dans le journal se corrige aussi sur la
# page de la version). Rien n'est créé ni supprimé : seules les notes de Releases qui existent déjà sont modifiées.
name: Notes de version

on:
  push:
    branches: [main]
    paths:
      - "CHANGELOG.md"
      - "scripts/notes-version.mjs"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: notes-de-version
  cancel-in-progress: false

jobs:
  notes:
    name: Notes des Releases
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Releases de l'application
        run: |
          for version in $(node scripts/notes-version.mjs CHANGELOG.md --versions); do
            if gh release view "v$version" > /dev/null 2>&1; then
              node scripts/notes-version.mjs CHANGELOG.md "$version" --release > "$RUNNER_TEMP/notes.md"
              gh release edit "v$version" --notes-file "$RUNNER_TEMP/notes.md"
              echo "notes remises : v$version"
            else
              echo "pas de Release pour v$version : ignorée"
            fi
          done
