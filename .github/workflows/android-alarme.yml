# Essai d'alarme Android natif (tools/essai-alarme) : fabrique l'APK à installer à la main sur le téléphone.
name: Android (essai d'alarme natif)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - tools/essai-alarme/**
      - .github/workflows/android-alarme.yml

concurrency:
  group: android-alarme-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: APK d'essai
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: APK
        working-directory: tools/essai-alarme
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v7
        with:
          name: essai-alarme.apk
          path: tools/essai-alarme/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
