# Publication d'un plugin dans le catalogue : à chaque étiquette « plugin-<id>-v<version> »
# (ex. plugin-tracage-v1.2.0), le plugin est testé, compilé, empaqueté et signé (scripts/paquet-plugin.mjs),
# puis déposé avec catalogue.json dans la Release « catalogue » (préversion : elle ne devient jamais
# « la dernière version » que lisent les mises à jour de l'application). Les Établi installés
# installent la nouvelle version au démarrage suivant. Marche à suivre : docs/14-publier-une-version.md.
name: Publication d'un plugin

on:
  push:
    tags: ["plugin-*"]

permissions:
  contents: write

# Un plugin à la fois : chaque publication relit puis réécrit catalogue.json.
concurrency:
  group: catalogue
  cancel-in-progress: false

jobs:
  plugin:
    name: Paquet signé et catalogue
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Plugin et version de l'étiquette
        id: tag
        run: |
          ref="${GITHUB_REF_NAME#plugin-}"
          id="${ref%-v*}"
          version="${ref##*-v}"
          manifest="plugins/$id/public/manifest.json"
          if [ ! -f "$manifest" ]; then
            echo "::error::Plugin « $id » introuvable. Étiquette attendue : plugin-<id>-v<version>."
            exit 1
          fi
          actuelle=$(node -p "require('./$manifest').version")
          if [ "$actuelle" != "$version" ]; then
            echo "::error::Étiquette en $version mais $manifest en $actuelle : mettez la version du manifeste à jour."
            exit 1
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Dépendances npm
        run: npm ci

      - name: Tests du plugin
        run: npm test -w "plugins/${{ steps.tag.outputs.id }}" --if-present

      - name: Compilation du plugin
        run: npm run build -w "plugins/${{ steps.tag.outputs.id }}"

      # Manifeste, journal des changements de cette version, contenu du plugin compilé.
      - name: Validation du plugin
        run: npm run valider -- "${{ steps.tag.outputs.id }}"

      - name: Catalogue actuel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p paquets
          gh release download catalogue --pattern catalogue.json --dir paquets \
            || echo "Aucun catalogue publié : il sera créé."

      - name: Paquet signé et catalogue mis à jour
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: node scripts/paquet-plugin.mjs "${{ steps.tag.outputs.id }}"

      - name: Publication dans la Release « catalogue »
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view catalogue > /dev/null 2>&1; then
            gh release create catalogue --title "Catalogue des plugins" --prerelease --latest=false \
              --notes "Paquets signés des plugins officiels et catalogue.json, lus par Établi pour installer et mettre à jour les plugins. Ne pas supprimer."
          fi
          gh release upload catalogue \
            "paquets/${{ steps.tag.outputs.id }}-${{ steps.tag.outputs.version }}.etabli-plugin" \
            paquets/catalogue.json paquets/catalogue.json.minisig --clobber
          # Texte de la Release « catalogue » : la liste des plugins et leurs nouveautés.
          node scripts/notes-catalogue.mjs paquets/catalogue.json --markdown > "$RUNNER_TEMP/notes-catalogue.md"
          gh release edit catalogue --notes-file "$RUNNER_TEMP/notes-catalogue.md"
