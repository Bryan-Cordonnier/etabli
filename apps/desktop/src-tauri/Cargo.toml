[package]
name = "etabli"
version = "0.5.0"
description = "Établi : boîte à outils de bureau extensible par plugins"
license = "MIT"
edition = "2021"
rust-version = "1.90"

# Bibliothèque Rust simple : les formats staticlib/cdylib ne servent qu'au mobile.
[lib]
name = "etabli_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.6", features = ["tray-icon"] }
tauri-plugin-log = "2"
uuid = { version = "1", features = ["v4"] }
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-autostart = "2.5.1"
tauri-plugin-opener = "2.5.5"
tauri-plugin-single-instance = "2.4.5"
tauri-plugin-dialog = "2.7.3"
tauri-plugin-updater = "2.13.0"
tauri-plugin-process = "2.4.0"
# Réglages TLS (rustls + fournisseur ring) partagés avec le module de mise à jour de l'application ; le moteur n'a
# plus de client réseau propre. Signatures et paquets de plugins : règles communes avec le serveur, dans etabli-noyau.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "system-proxy", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
etabli-noyau = { path = "../../../crates/noyau" }

[dev-dependencies]
# Fabrication de paquets d'essai dans les tests.
zip = { version = "8", default-features = false, features = ["deflate-flate2"] }
flate2 = "1"

# Binaire de production plus petit et plus rapide.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
